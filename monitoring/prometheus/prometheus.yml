global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: traefik
    metrics_path: /metrics
    static_configs:
      - targets:
          - 127.0.0.1:8082

  - job_name: cadvisor
    metrics_path: /metrics
    static_configs:
      - targets:
          - 127.0.0.1:8083
