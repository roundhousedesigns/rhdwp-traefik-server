# Localhost metrics plus Grafana. rhdwpTraefik starts this project after Traefik
# and stops it without -v. FQDN, GRAFANA_ADMIN_USER, and GRAFANA_ADMIN_PASSWORD
# come from traefik/.env (exported by the script before `up`).
name: monitoring

services:
  prometheus:
    image: prom/prometheus:v3.16.0
    container_name: prometheus
    restart: unless-stopped
    network_mode: host
    security_opt:
      - no-new-privileges:true
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.listen-address=127.0.0.1:9090
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  cadvisor:
    image: ghcr.io/google/cadvisor:0.60.6
    container_name: cadvisor
    restart: unless-stopped
    network_mode: host
    # Privileged plus /dev/kmsg matches the upstream quick start so CPU and
    # memory stats are readable on cgroup v2. Nothing here is published.
    privileged: true
    mem_limit: 256m
    devices:
      - /dev/kmsg
    command:
      - --listen_ip=127.0.0.1
      - --port=8083
      - --docker_only=true
      - --disable_root_cgroup_stats=true
      - --housekeeping_interval=15s
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

  grafana:
    image: grafana/grafana:13.3.0
    container_name: grafana
    restart: unless-stopped
    network_mode: host
    security_opt:
      - no-new-privileges:true
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: "3000"
      GF_SERVER_ROOT_URL: https://${FQDN:?FQDN is required}/
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      # Classic dashboard JSON. Grafana uses this file as the org home page.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/mission-control.json
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro

volumes:
  prometheus-data:
  grafana-data:
